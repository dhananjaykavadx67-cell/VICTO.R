<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V.I.C.T.O.R.</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#02070c;color:#8ffaff;
 font-family:Arial,sans-serif
}
canvas{position:absolute;inset:0;width:100%;height:100%}

#info{
 position:absolute;top:25px;left:30px;
 font-size:13px;line-height:2;
 letter-spacing:3px;
 text-shadow:0 0 10px #00eaff
}

#state{
 position:absolute;left:30px;bottom:28px;
 font-size:18px;letter-spacing:5px
}

#response{
 position:absolute;left:30px;bottom:70px;
 max-width:430px;
 font-size:15px;line-height:1.5
}

#halt{
 position:absolute;right:30px;bottom:25px;
 padding:11px 22px;
 background:#001018;
 border:1px solid #00eaff;
 border-radius:5px;
 color:#8ffaff;
 font-weight:bold
}
</style>
</head>

<body>

<canvas id="hud"></canvas>

<div id="info">
V.I.C.T.O.R.<br>
VOICE-INTEGRATED INTELLIGENT CONTROLLER<br>
SYSTEM ONLINE
</div>

<div id="response"></div>
<div id="state">INITIALIZING...</div>

<button id="halt">MUTE / HALT</button>

<script>

const canvas=document.getElementById("hud");
const ctx=canvas.getContext("2d");
const state=document.getElementById("state");
const responseBox=document.getElementById("response");
const halt=document.getElementById("halt");

let W,H,dpr,t=0;
let muted=false;
let recognition=null;
let listening=false;

function resize(){

 dpr=devicePixelRatio||1;

 W=innerWidth;
 H=innerHeight;

 canvas.width=W*dpr;
 canvas.height=H*dpr;

 canvas.style.width=W+"px";
 canvas.style.height=H+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();


/* ================= HUD ================= */

function draw(){

 requestAnimationFrame(draw);

 t+=.025;

 ctx.clearRect(0,0,W,H);

 const cx=W*.72;
 const cy=H*.52;
 const r=Math.min(W,H)*.25;

 ctx.save();
 ctx.translate(cx,cy);

 /* radial bars */

 for(let i=0;i<128;i++){

  const a=i/128*Math.PI*2;

  const wave=
   Math.sin(t*3+i*.23)*.5+
   Math.sin(t*1.7+i*.07)*.3+
   .8;

  const inner=r*.78;
  const outer=inner+25+wave*18;

  ctx.beginPath();

  ctx.moveTo(
   Math.cos(a)*inner,
   Math.sin(a)*inner
  );

  ctx.lineTo(
   Math.cos(a)*outer,
   Math.sin(a)*outer
  );

  ctx.strokeStyle=
   i%4===0
   ?"rgba(150,255,255,.9)"
   :"rgba(0,210,255,.35)";

  ctx.lineWidth=2;
  ctx.stroke();
 }

 /* rings */

 for(let i=0;i<3;i++){

  ctx.beginPath();

  ctx.arc(
   0,0,
   r*(1+i*.18),
   0,Math.PI*2
  );

  ctx.strokeStyle=
   `rgba(0,220,255,${.25-i*.05})`;

  ctx.lineWidth=2;
  ctx.stroke();
 }

 /* core glow */

 const glow=ctx.createRadialGradient(
  0,0,10,
  0,0,r*.8
 );

 glow.addColorStop(0,"rgba(150,255,255,.9)");
 glow.addColorStop(.2,"rgba(0,220,255,.45)");
 glow.addColorStop(1,"rgba(0,30,50,0)");

 ctx.fillStyle=glow;

 ctx.beginPath();
 ctx.arc(0,0,r*.65,0,Math.PI*2);
 ctx.fill();

 /* rotating arc */

 ctx.beginPath();

 ctx.arc(
  0,0,r*.95,
  t%6.28,
  t%6.28+.8
 );

 ctx.strokeStyle="#9fffff";
 ctx.lineWidth=4;
 ctx.stroke();

 ctx.restore();
}

draw();


/* ================= STATE ================= */

function setState(text){
 state.textContent=text;
}


/* ================= SPEECH ================= */

function speak(text){

 if(muted)return;

 speechSynthesis.cancel();

 setState("SPEAKING");

 const voice=new SpeechSynthesisUtterance(text);

 voice.lang="en-IN";
 voice.rate=.95;
 voice.pitch=.9;

 voice.onend=()=>{

  if(!muted)
   startListening();

 };

 speechSynthesis.speak(voice);
}


/* ================= GEMINI REQUEST ================= */

async function ask(text){

 setState("PROCESSING");

 responseBox.textContent=text;

 try{

  const res=await fetch("/api/ask",{

   method:"POST",

   headers:{
    "Content-Type":"application/json"
   },

   body:JSON.stringify({
    message:text
   })

  });

  const data=await res.json();

  if(!res.ok)
   throw new Error(data.error||"Server error");

  responseBox.textContent=data.text;

  speak(data.text);

 }catch(error){

  console.error(error);

  const msg=
   "I am unable to reach my neural core right now.";

  responseBox.textContent=msg;

  speak(msg);
 }
}


/* ================= VOICE RECOGNITION ================= */

function startListening(){

 if(muted)return;

 const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){

  setState("VOICE UNSUPPORTED");

  responseBox.textContent=
   "Voice recognition is not supported by this browser.";

  return;
 }

 if(listening)return;

 recognition=new SpeechRecognition();

 recognition.lang="en-IN";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{

  listening=true;
  setState("LISTENING");

 };

 recognition.onresult=e=>{

  listening=false;

  const text=
   e.results[0][0].transcript;

  ask(text);

 };

 recognition.onerror=e=>{

  listening=false;

  if(e.error==="not-allowed"){

   setState("MIC PERMISSION");

   responseBox.textContent=
    "Please allow microphone access.";

  }else{

   setState("LISTENING");

   setTimeout(startListening,1000);
  }

 };

 recognition.onend=()=>{

  listening=false;

 };

 try{
  recognition.start();
 }catch(e){}

}


/* ================= STARTUP ================= */

function startup(){

 setState("STARTUP");

 speak(
  "Good evening. I am V.I.C.T.O.R., created by Dhananjay and Kartik. All systems are online. Neural core is ready."
 );

}


/* ================= HALT ================= */

halt.onclick=()=>{

 muted=!muted;

 if(muted){

  speechSynthesis.cancel();

  if(recognition){
   try{recognition.stop()}catch(e){}
  }

  halt.textContent="RESUME";
  setState("MUTED");

 }else{

  halt.textContent="MUTE / HALT";
  startup();

 }

};


/* ================= START ================= */

window.onload=()=>{

 setTimeout(startup,700);

};

</script>

</body>
</html>
